name: StreamFlex JioTV Mobile API — ZioMobile M3U Sync

on:
  schedule:
    - cron: '30 */2 * * *'
  workflow_dispatch:

jobs:
  jiotvmobile-api-fetch:
    name: Fetch JioTV Mobile API & Export ZioMobile.m3u
    runs-on: ubuntu-latest

    env:
      JTVM_API_ENDPOINT: ${{ secrets.JTVM_API_ENDPOINT }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate JioTV Mobile API Endpoint
        id: validate_jtvm_api
        run: |
          if [ -z "$JTVM_API_ENDPOINT" ]; then
            echo "::error::JTVM_API_ENDPOINT secret is not configured!"
            exit 1
          fi
          echo "API endpoint verified. Initiating JioTV Mobile sync..."

      - name: Request JioTV Mobile API & Stream M3U Data
        id: jtvm_fetch
        run: |
          echo "Initiating JioTV Mobile API request..."

          RESPONSE_FILE="jtvm_payload.tmp"

          HTTP_CODE=$(curl -o "$RESPONSE_FILE" -w "%{http_code}" \
            --max-time 45 \
            --retry 4 \
            --retry-delay 6 \
            --retry-all-errors \
            --compressed \
            --silent \
            --show-error \
            -H "Accept: */*" \
            -H "Cache-Control: no-cache" \
            "$JTVM_API_ENDPOINT")

          echo "JTVM_HTTP_CODE=$HTTP_CODE" >> $GITHUB_ENV
          echo "JTVM_RESPONSE_FILE=$RESPONSE_FILE" >> $GITHUB_ENV

          PAYLOAD_SIZE=$(wc -c < "$RESPONSE_FILE" 2>/dev/null || echo 0)
          echo "JTVM_PAYLOAD_SIZE=$PAYLOAD_SIZE" >> $GITHUB_ENV

          if [ "$HTTP_CODE" -eq 200 ] && [ "$PAYLOAD_SIZE" -gt 0 ]; then
            echo "JTVM_FETCH_STATUS=success" >> $GITHUB_ENV
            echo "✅ JioTV Mobile API — HTTP $HTTP_CODE | Payload: ${PAYLOAD_SIZE} bytes"
          elif [ "$HTTP_CODE" -eq 200 ] && [ "$PAYLOAD_SIZE" -eq 0 ]; then
            echo "JTVM_FETCH_STATUS=empty" >> $GITHUB_ENV
            echo "::warning::JioTV Mobile API returned HTTP 200 but payload is empty."
          else
            echo "JTVM_FETCH_STATUS=failed" >> $GITHUB_ENV
            echo "::warning::JioTV Mobile API returned HTTP $HTTP_CODE. Marking as failed."
          fi

      - name: Build ZioMobile.m3u from API Payload
        run: |
          if [ "$JTVM_FETCH_STATUS" = "success" ]; then
            cp "$JTVM_RESPONSE_FILE" ZioMobile.m3u
            echo "✅ ZioMobile.m3u built from live JioTV Mobile API payload."
          elif [ "$JTVM_FETCH_STATUS" = "empty" ]; then
            echo "Api Empty Response" > ZioMobile.m3u
            echo "⚠️ ZioMobile.m3u flagged — API returned empty payload."
          else
            echo "Api Fetch Failed" > ZioMobile.m3u
            echo "❌ ZioMobile.m3u flagged — API fetch failed (HTTP $JTVM_HTTP_CODE)."
          fi

      - name: Commit & Push ZioMobile.m3u to Repository
        run: |
          git config user.name  "jtvm-api-bot"
          git config user.email "jtvm-api-bot@users.noreply.github.com"

          git add ZioMobile.m3u

          if git diff --cached --quiet; then
            echo "ℹ️ ZioMobile.m3u unchanged. No commit required."
          else
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')

            if [ "$JTVM_FETCH_STATUS" = "success" ]; then
              COMMIT_MSG="chore(jtvm-api): sync ZioMobile.m3u [$TIMESTAMP]"
            elif [ "$JTVM_FETCH_STATUS" = "empty" ]; then
              COMMIT_MSG="chore(jtvm-api): empty payload — ZioMobile.m3u [$TIMESTAMP]"
            else
              COMMIT_MSG="chore(jtvm-api): fetch failed — ZioMobile.m3u [$TIMESTAMP]"
            fi

            git commit -m "$COMMIT_MSG"
            git push
            echo "✅ ZioMobile.m3u committed and pushed."
          fi

      - name: JioTV Mobile API Sync Report
        run: |
          echo "=================================="
          echo "  StreamFlex JioTV Mobile Sync Report"
          echo "=================================="
          echo "  HTTP Code    : $JTVM_HTTP_CODE"
          echo "  Fetch Status : $JTVM_FETCH_STATUS"
          echo "  Payload Size : $JTVM_PAYLOAD_SIZE bytes"
          echo "  Output File  : ZioMobile.m3u"
          echo "  Schedule     : Every 2 hours at :30"
          echo "=================================="
